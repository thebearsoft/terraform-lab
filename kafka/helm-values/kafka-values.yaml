# Airflow Configuration
airflow:
  image:
    repository: ${airflow_image_repository}
    tag: ${airflow_image_tag}
    pullPolicy: IfNotPresent

  # Executor configuration
  executor: ${executor}
  
  # Core Airflow settings
  config:
    AIRFLOW__CORE__PARALLELISM: ${parallelism}
    AIRFLOW__CORE__LOAD_EXAMPLES: ${load_examples}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
    AIRFLOW__LOGGING__REMOTE_LOGGING: "True"
    AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: "gs://${gcs_bucket}/logs"
    AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: "gcs_default"

# Database configuration
data:
  metadataConnection:
    host: ${database_host}
    port: 5432
    db: ${database_name}
    user: ${database_username}
    pass: ${database_password}
    protocol: postgresql
    sslmode: require

# Scheduler configuration
scheduler:
  replicas: ${scheduler_replicas}
  resources:
    requests:
      cpu: ${scheduler_cpu_request}
      memory: ${scheduler_memory_request}
    limits:
      cpu: ${scheduler_cpu_limit}
      memory: ${scheduler_memory_limit}
  serviceAccount:
    create: false
    name: ${service_account_name}

# Webserver configuration  
webserver:
  replicas: ${webserver_replicas}
  resources:
    requests:
      cpu: ${webserver_cpu_request}
      memory: ${webserver_memory_request}
    limits:
      cpu: ${webserver_cpu_limit}
      memory: ${webserver_memory_limit}
  serviceAccount:
    create: false
    name: ${service_account_name}
  defaultUser:
    enabled: true
    username: ${webserver_default_user_username}
    password: ${webserver_default_user_password}
    email: ${webserver_default_user_email}
    role: Admin
  service:
    type: ClusterIP

# Worker configuration
workers:
  replicas: ${worker_replicas}
  resources:
    requests:
      cpu: ${worker_cpu_request}
      memory: ${worker_memory_request}
    limits:
      cpu: ${worker_cpu_limit}
      memory: ${worker_memory_limit}
  serviceAccount:
    create: false
    name: ${service_account_name}

# DAGs configuration
dags:
  %{if dags_pvc_enabled}
  persistence:
    enabled: true
    existingClaim: airflow-dags-pvc
  %{else}
  gitSync:
    enabled: false
  %{endif}

# Logs configuration  
logs:
  persistence:
    enabled: false

# Redis configuration (for CeleryExecutor)
redis:
  enabled: true
  auth:
    enabled: false

# PostgreSQL (disabled since we use Cloud SQL)
postgresql:
  enabled: false

# Ingress configuration
ingress:
  web:
    enabled: ${ingress_enabled}
    hosts:
      - name: ""
        path: "/"
    ingressClassName: nginx

# Service account configuration
serviceAccount:
  create: false
  name: ${service_account_name}
  annotations:
    iam.gke.io/gcp-service-account: ${service_account_name}@bearsoft-demo.iam.gserviceaccount.com